<svg width="1430" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue +7 Card -->
  <g transform="translate(0, 160) rotate(-30)">
    <rect x="0" y="0" rx="20" ry="20" width="280" height="480" fill="blue" stroke="black" stroke-width="5"/>
    <text x="140" y="240" font-family="Roboto" font-size="200" fill="white" text-anchor="middle" dominant-baseline="middle">+7</text>
    <text x="30" y="30" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle">+7</text>
    <text x="250" y="450" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 250,450)">+7</text>
  </g>
  
  <!-- Red ×4 Card -->
  <g transform="translate(260, 50) rotate(0)">
    <rect x="0" y="0" rx="20" ry="20" width="280" height="480" fill="red" stroke="black" stroke-width="5"/>
    <text x="140" y="240" font-family="Roboto" font-size="200" fill="white" text-anchor="middle" dominant-baseline="middle">×4</text>
    <text x="30" y="30" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle">×4</text>
    <text x="250" y="450" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 250,450)">×4</text>
  </g>

  <!-- Green +2 Card -->
  <g transform="translate(550, 65) rotate(30)">
    <rect x="0" y="0" rx="20" ry="20" width="280" height="480" fill="green" stroke="black" stroke-width="5"/>
    <text x="140" y="240" font-family="Roboto" font-size="200" fill="white" text-anchor="middle" dominant-baseline="middle">+2</text>
    <text x="30" y="30" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle">+2</text>
    <text x="250" y="450" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 250,450)">+2</text>
  </g>
  
  <!-- Magenta +8 Card -->
  <g transform="translate(870, 100) rotate(-15)">
    <rect x="0" y="0" rx="20" ry="20" width="280" height="480" fill="magenta" stroke="black" stroke-width="5"/>
    <text x="140" y="240" font-family="Roboto" font-size="200" fill="white" text-anchor="middle" dominant-baseline="middle">+8</text>
    <text x="30" y="30" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle">+8</text>
    <text x="250" y="450" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 250,450)">+8</text>
  </g>
  
  <!-- Orange ×5 Card -->
  <g transform="translate(1150, 65) rotate(15)">
    <rect x="0" y="0" rx="20" ry="20" width="280" height="480" fill="orange" stroke="black" stroke-width="5"/>
    <text x="140" y="240" font-family="Roboto" font-size="200" fill="white" text-anchor="middle" dominant-baseline="middle">×5</text>
    <text x="30" y="30" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle">×5</text>
    <text x="250" y="450" font-family="Roboto" font-size="35" fill="white" text-anchor="middle" dominant-baseline="middle" transform="rotate(180 250,450)">×5</text>
  </g>
