          count: 5
      - large:
          generate: rand.py {seed} 100000*{count}
          count: 5
      - max:
          generate: rand.py {seed} 500000
          count: 3
      - small:
          generate: rand_shuffle.py {seed} 20 0
          count: 4
      - small:
          generate: rand_shuffle.py {seed} 20 3
          count: 4
      - small:
          generate: rand_shuffle.py {seed} 20 5
          count: 4
      - small:
          generate: rand_shuffle.py {seed} 20 10
          count: 4
      - medium:
          generate: rand_shuffle.py {seed} 1000 0
          count: 2
      - medium:
