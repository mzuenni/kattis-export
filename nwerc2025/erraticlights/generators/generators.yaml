solution: /submissions/accepted/yidi-linear2.cpp
version: 2025-08 # use this version of the generators framework

test_group.yaml:
  # One or more of:
  # case_sensitive
  # space_change_sensitive
  # float_absolute_tolerance eps
  # float_relative_tolerance eps
  # float_tolerance eps
  output_validator_args: [float_tolerance, "1e-6"]

data:
  sample:
    data:
      - "":
          in: |
            2
            rb
          ans: "3"
      - "":
          in: |
            3
            ggg
          ans: "0"
      - "":
          in: |
            5
            rgbrg
          ans: "7.5"

  secret:
    data:
      - max: max.py
      - max-2: max-2.py

      - size-100-only-r: gen.py   -1   100  1 0 0
      - size-100-only-g: gen.py   -1   100  0 1 0
      - size-100-only-b: gen.py   -1   100  0 0 1
      - size-100-no-r:   gen.py {seed} 100  0 1 1
      - size-100-no-g:   gen.py {seed} 100  1 0 1
      - size-100-no-b:   gen.py {seed} 100  1 1 0

      - only-r: gen.py {seed} 50..100  1 0 0
      - only-g: gen.py {seed} 50..100  0 1 0
      - only-b: gen.py {seed} 50..100  0 0 1
      - no-r:   gen.py {seed} 50..100  0 1 1
      - no-g:   gen.py {seed} 50..100  1 0 1
      - no-b:   gen.py {seed} 50..100  1 1 0

      # The first test case in each of these blocks will have the standard (1, 1, 1) weights, but that's fine.
      # However, the rules need different {seed:#}s, else BAPCtools will warn that the rules are equal
      # (which they are, but again, that's fine).
      - many-r:
          generate: gen.py {seed:1} 80..100  {count} 1 1
          count: 10
      - many-g:
          generate: gen.py {seed:2} 80..100  1 {count} 1
          count: 10
      - many-b:
          generate: gen.py {seed:3} 80..100  1 1 {count}
          count: 10
      - few-r:
          generate: gen.py {seed:4} 80..100  1 {count} {count}
          count: 10
      - few-g:
          generate: gen.py {seed:5} 80..100  {count} 1 {count}
          count: 10
      - few-b:
          generate: gen.py {seed:6} 80..100  {count} {count} 1
          count: 10

      - mostly-r: gen.py {seed} 80..100  50 1 1
      - mostly-g: gen.py {seed} 80..100  1 50 1
      - mostly-b: gen.py {seed} 80..100  1 1 50
      - barely-r: gen.py {seed} 80..100  1 25 25
      - barely-g: gen.py {seed} 80..100  25 1 25
      - barely-b: gen.py {seed} 80..100  25 25 1

      - mostly-r-no-b: gen.py {seed} 80..100  50 1 0
      - mostly-g-no-r: gen.py {seed} 80..100  0 50 1
      - mostly-b-no-g: gen.py {seed} 80..100  1 0 50
      - barely-r-no-b: gen.py {seed} 80..100  1 50 0
      - barely-g-no-r: gen.py {seed} 80..100  0 1 50
      - barely-b-no-g: gen.py {seed} 80..100  50 0 1

      - min:
          in: |
            1
            r
          ans: "0"
      - min:
          in: |
            1
            g
          ans: "0"
      - min:
          in: |
            1
            b
          ans: "0"

      - two:
          in: |
            2
            rr
          ans: "0"
      - two:
          in: |
            2
            gg
          ans: "0"
      - two:
          in: |
            2
            bb
          ans: "0"

      - two:
          in: |
            2
            rg
          ans: "3"
      - two:
          in: |
            2
            gb
          ans: "3"
      - two:
          in: |
