# Explanation of generators:
# long-intervals.py: people leave at 0..n, and come back at n..2n in random order.
# - todo: choose k much smaller than n-1.
# gaps.py: each person is always gone (from i to LARGE+i), apart from a gap of size 1
# - todo: variable size gaps of exponentially distributed length
# rand.py:
# 1. predetermine all interval start/ends
# 2. at each point in time: try `weight` random people and if they are inside
#    make them leave
# 3. otherwise make an outside person come in.
# - todo: change the probability of making a person leave.
# multitest.py: for fixed n and k, generate many small random possible testcases and concatenate them

